# The release as a workflow a consumer calls rather than copies. Every step reads binary-kit.config.js; the
# build matrix is all a caller passes, since only the caller knows how to build.
#
# Under .github/workflows/ because GitHub resolves a called workflow nowhere else, and a copy anywhere tidier
# fails at trigger time with "workflow was not found".

on:
  workflow_call:
    inputs:
      version:
        description: The version to release. Usually the tag without its leading v.
        required: true
        type: string
      targets:
        description: JSON array of target names, matching binary-kit.config.js.
        required: true
        type: string
      node-version-file:
        description: Where the node version comes from. package.json's engines by default.
        required: false
        default: package.json
        type: string
    secrets:
      NPM_TOKEN:
        description: Only for dist-tag writes. Publishing itself uses the job's OIDC identity.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Every artifact a build job uploaded, into the tree the kit reads. Named by target, so the layout is
      # the kit's own rather than a shape reconstructed here.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Put the artifacts where the kit looks for them
        run: |
          set -euo pipefail
          for target in $(echo '${{ inputs.targets }}' | node -e 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).forEach(t=>console.log(t))'); do
            if [ -d "artifacts/bin-$target" ]; then
              mkdir -p "build/$target/bin"
              mv "artifacts/bin-$target"/* "build/$target/bin/"
            fi
            # Anything shipped beside the binaries keeps its own path under the build tree, which is what
            # `extraDirs` names and what the staging copies verbatim.
            if [ -d "artifacts/share-$target" ]; then
              mkdir -p "build/$target/share"
              mv "artifacts/share-$target"/* "build/$target/share/"
            fi
          done

      # The release's version, set the way npm sets it, so optionalDependencies move with it. --allow-same-version
      # makes a re-run of the same tag safe.
      - name: Set the version from the release
        run: npm version '${{ inputs.version }}' --no-git-tag-version --allow-same-version

      - run: npx harper-binary-kit stage

      # Every target: `floor` is a no-op where a config declares none, and a build on a newer runner produces
      # a binary that will not load on the image it ships to while every test on that runner passes.
      - name: Symbol floors
        run: |
          set -euo pipefail
          echo '${{ inputs.targets }}' \
            | node -e 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).forEach(t=>console.log(t))' \
            | while read -r target; do npx harper-binary-kit floor "$target"; done

      - run: npx harper-binary-kit verify

      # Publishing authenticates by the job's OIDC identity through npm trusted publishers. No token is read
      # here, and none is needed.
      - run: npx harper-binary-kit publish

      # `dist-tag add` is the one step OIDC has not covered: a job that had just published ten packages was
      # answered E401 for every tag write, so a token is used where one is given and a failure names the fix.
      - name: Point latest at this release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx harper-binary-kit latest
